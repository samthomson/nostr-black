[package]
name = "nostr-black"
version = "0.1.0"
description = "nostr.black — privacy-first nostr client, all egress through bundled Tor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
arti-client = { version = "0.28", default-features = false, features = ["tokio", "native-tls"] }
tor-rtcompat = { version = "0.28", features = ["tokio", "native-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["socks", "json"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
base64 = "0.22"
futures-util = "0.3"

[profile.release]
strip = true
lto = true
